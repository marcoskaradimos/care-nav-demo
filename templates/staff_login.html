<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff Login — Health Access</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <div class="navbar-brand">
                <img src="{{ url_for('static', filename='images/health_access_logo.png') }}" alt="Logo" style="height:42px;width:42px;object-fit:contain;" />
                <span style="font-size:17px;font-weight:700;color:#fff;letter-spacing:-0.01em;">Health Access</span>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="login-page">
            <div class="login-card">
                <div class="login-header">
                    <img src="{{ url_for('static', filename='images/health_access_logo.png') }}" alt="Health Access Logo" style="height:80px;width:80px;object-fit:contain;margin-bottom:8px;" />
                    <h1 class="login-title">Health Access</h1>
                    <p class="login-subtitle">Staff Portal</p>
                </div>

                {% if error %}
                <div class="alert alert-error">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M8 5v4M8 11v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    {{ error }}
                </div>
                {% endif %}

                <form method="POST" action="{{ url_for('staff_login') }}" class="login-form">
                    <div class="form-group">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                                <circle cx="8" cy="5" r="3" stroke="currentColor" stroke-width="1.5"/>
                                <path d="M2 14c0-3.314 2.686-5 6-5s6 1.686 6 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                            <input
                                type="text"
                                id="username"
                                name="username"
                                class="form-input"
                                placeholder="Enter your username"
                                autocomplete="username"
                                required
                                autofocus
                            />
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                                <rect x="3" y="7" width="10" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
                                <path d="M5.5 7V5a2.5 2.5 0 015 0v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-input"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            />
                        </div>
                    </div>

                    <button type="submit" class="btn-login">
                        Sign In
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </form>

                <div class="login-footer">
                    <p>Staff access only. Unauthorised access is prohibited.</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
